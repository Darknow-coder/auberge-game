<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prisme</title>
  <meta name="description" content="Prisme, le puzzle de blocs lumineux : glissez les pièces, complétez lignes et colonnes, enchaînez les combos. Gratuit, sans publicité, jouable hors ligne.">
  <meta name="theme-color" content="#17123f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prisme">
  <meta property="og:title" content="Prisme">
  <meta property="og:description" content="Le puzzle de blocs lumineux. Glissez, complétez, enchaînez.">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grain"></i></div>
  <canvas id="stage" aria-hidden="true"></canvas>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Prisme a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
